name: Sula Wine CI Pipeline

on:
  push:
    branches: [ main ]  # Jab bhi main branch mein code aaye

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/sula-wine-app:latest .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/sula-wine-app:latest