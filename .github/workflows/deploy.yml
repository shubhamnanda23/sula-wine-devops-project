name: Sula Wine CI-CD

on:
  push:
    branches: [ main ] # Jab bhi main branch par push hoga, ye chalega

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
          # Yahan shm235/sula-wine-app ko latest tag ke saath push karenge
        run: |
          docker build -t shm235/sula-wine-app:latest .
          docker push shm235/sula-wine-app:latest

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Update Kubeconfig
        run: aws eks update-kubeconfig --name sula-wine-cluster --region ap-south-1

      - name: Deploy to EKS
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
          # Force restart taaki naya image pull ho sake
          kubectl rollout restart deployment/sula-wine-deployment